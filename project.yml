name: Porridge
options:
  bundleIdPrefix: de.letzgo
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    # Newer than release 0.17.7: needed for `OfflineDiarizerManager.embedSpans` (voice recognition).
    revision: c9cad1bb62cedb283fa557cd37df0a63241ab592
    traits: [NemoTextProcessing, Diarizer]
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    majorVersion: 3.32.3
  HuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
settings:
  base:
    DEVELOPMENT_TEAM: 699G2QY959
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 1.1.9
    CURRENT_PROJECT_VERSION: 1
    # TestFlight (iPhone, iPad, Mac) stays on its own version. For a new iOS build only raise the number below, above the last upload.
    TESTFLIGHT_MARKETING_VERSION: "1.0"
    IOS_BUILD_NUMBER: 131
    CODE_SIGN_STYLE: Automatic
targets:
  Porridge:
    type: application
    platform: iOS
    sources:
      - path: Porridge
      - path: Shared
    dependencies:
      - package: FluidAudio
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      - target: PorridgeWidgets
        embed: true
      - target: PorridgeShare
        embed: true
    entitlements:
      path: Porridge/Porridge.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.letzgo.porridge
        aps-environment: development
        com.apple.developer.background-tasks.continued-processing.gpu: true
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.de.letzgo.porridge
        # CloudKit: the notes (SwiftData). CloudDocuments: recordings and attachments, in the same container's
        # iCloud Drive storage (Recordings/, Attachments/; outside Documents/, so never visible in iCloud Drive).
        com.apple.developer.icloud-services:
          - CloudKit
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.de.letzgo.porridge
        # Every build, Debug included, uses the Production CloudKit database (the one TestFlight uses).
        com.apple.developer.icloud-container-environment: Production
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: Porridge/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Porridge
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # Bowls can be shared with other iCloud users (CloudKit share links open the app).
        CKSharingSupported: true
        # porridge:// links (EntryLinkRouter): entry/<UUID> opens that entry (links between entries, widgets);
        # new, meeting, inbox, todos and search?q=… come from the widgets (`QuickAction(url:)`).
        CFBundleURLTypes:
          - CFBundleURLName: de.letzgo.porridge
            CFBundleURLSchemes:
              - porridge
        NSMicrophoneUsageDescription: Porridge records meetings and notes with the microphone and transcribes them on your device.
        NSCameraUsageDescription: Porridge scans letters, receipts and other documents with the camera and reads their text on your device.
        NSCalendarsFullAccessUsageDescription: Porridge reads your calendars to name recorded meetings after their appointment, offer the people invited as speaker names, and alert you shortly before a meeting so you can record it. It never changes your calendars.
        NSBluetoothAlwaysUsageDescription: Porridge connects to your Plaud recorder over Bluetooth to import your recordings.
        # A server of your own at home (Ollama) often has no certificate: plain http is allowed there, and only there.
        NSLocalNetworkUsageDescription: Porridge connects to servers in your network that you entered yourself, such as your own AI model.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        BGTaskSchedulerPermittedIdentifiers:
          - de.letzgo.porridge.summary.*
        UIBackgroundModes:
          - audio
          - processing
          - remote-notification
        UILaunchScreen:
          UIColorName: BrandSky
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        MARKETING_VERSION: $(TESTFLIGHT_MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(IOS_BUILD_NUMBER)
        PRODUCT_BUNDLE_IDENTIFIER: de.letzgo.porridge
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
  PorridgeMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      # The Mac app has its own AppKit interface (PorridgeMac); it shares the models, services, the Markdown
      # editor (Editor) and the assets, not the SwiftUI views and their entry.
      - path: Porridge
        excludes:
          - App/PorridgeApp.swift
          - App/RootView.swift
          - App/OnboardingView.swift
          - Views
          - Design/Theme.swift
          - Design/BrandMenuLabel.swift
          - Info.plist
          - Porridge.entitlements
      - path: Shared
      - path: PorridgeMac
        excludes:
          - Info.plist
          - PorridgeMac.entitlements
          - PorridgeMacBeta.entitlements
    dependencies:
      - package: FluidAudio
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    # Every build (Debug and TestFlight) uses the Production CloudKit database. TestFlight (scripts/testflight-mac.sh)
    # signs with PorridgeMac/PorridgeMacBeta.entitlements, kept by hand: the same plus the sandbox; keep it in step.
    entitlements:
      path: PorridgeMac/PorridgeMac.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.de.letzgo.porridge
        # CloudKit: the notes. CloudDocuments: recordings and attachments (see the iOS target).
        com.apple.developer.icloud-services:
          - CloudKit
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.de.letzgo.porridge
        # Small settings shared with the iPhone (the rewrite presets, the hint of the day): the same store as the
        # iOS app (same bundle identifier).
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.developer.icloud-container-environment: Production
        com.apple.developer.aps-environment: development
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.device.bluetooth: true
        # The local MCP server (Settings › MCP Server) listens on 127.0.0.1 only.
        com.apple.security.network.server: true
    info:
      path: PorridgeMac/Info.plist
      properties:
        CFBundleDisplayName: Porridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # Bowls can be shared with other iCloud users (CloudKit share links open the app).
        CKSharingSupported: true
        # porridge://entry/<UUID> opens that entry (links between entries, widgets; EntryLinkRouter).
        CFBundleURLTypes:
          - CFBundleURLName: de.letzgo.porridge
            CFBundleURLSchemes:
              - porridge
        NSMicrophoneUsageDescription: Porridge records meetings and notes with the microphone and transcribes them on your Mac. For dictation it listens while you hold the shortcut.
        # Meetings record the Mac's sound too (Core Audio process tap, SystemAudioTap): the other side of a call.
        NSAudioCaptureUsageDescription: Porridge records the sound of your Mac during a meeting, such as the other side of a Zoom, Meet or Teams call, and transcribes it on your Mac, so the transcript has everyone.
        NSCalendarsFullAccessUsageDescription: Porridge reads your calendars to name recorded meetings after their appointment, offer the people invited as speaker names, and alert you shortly before a meeting so you can record it. It never changes your calendars.
        NSBluetoothAlwaysUsageDescription: Porridge connects to your Plaud recorder over Bluetooth to import your recordings.
        # A server of your own at home (Ollama) often has no certificate: plain http is allowed there, and only there.
        NSLocalNetworkUsageDescription: Porridge connects to servers in your network that you entered yourself, such as your own AI model.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSAppleEventsUsageDescription: Porridge pastes the dictated text into the app you are using.
        ITSAppUsesNonExemptEncryption: false
        # Mails (.eml) can be opened with Porridge and dropped on its Dock icon: each becomes an inbox entry.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Email Message
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.mail.email
              - public.email-message
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.letzgo.porridge
        PRODUCT_NAME: Porridge
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
  PorridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PorridgeTests
    dependencies:
      - target: Porridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.letzgo.porridge.tests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  PorridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PorridgeUITests
    dependencies:
      - target: Porridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.letzgo.porridge.uitests
        TEST_TARGET_NAME: Porridge
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  PorridgeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PorridgeWidgets
      - path: Shared
    # The app group: the widgets read the app's copy of the notes there and queue the to-dos ticked in them
    # (`WidgetStore`), and see what the share sheet and shortcuts left in the inbox (`ShareInbox`).
    entitlements:
      path: PorridgeWidgets/PorridgeWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.letzgo.porridge
    info:
      path: PorridgeWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Porridge
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        MARKETING_VERSION: $(TESTFLIGHT_MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(IOS_BUILD_NUMBER)
        PRODUCT_BUNDLE_IDENTIFIER: de.letzgo.porridge.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  PorridgeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: PorridgeShare
      - path: Shared/ShareInbox.swift
    entitlements:
      path: PorridgeShare/PorridgeShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.letzgo.porridge
    info:
      path: PorridgeShare/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Porridge
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Links, text, pictures, movies, audio, mails, PDFs and documents (office, iWork, rich text, tables,
            # archives), named one by one: not `public.data`, which would offer Porridge for contacts, passes and
            # everything else. `public.email-message` is listed for a mail a mail app shares as its source.
            NSExtensionActivationRule: >-
              SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.email-message"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.composite-content"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.spreadsheet"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.presentation"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.rtf"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.comma-separated-values-text"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.microsoft.word.doc"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.microsoft.excel.xls"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.microsoft.powerpoint.ppt"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.openxmlformats.openxml"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.oasis-open.opendocument"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.iwork.pages.sffpages"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.iwork.numbers.sffnumbers"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.iwork.keynote.sffkey"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.zip-archive"
              ).@count >= 1).@count >= 1
    settings:
      base:
        MARKETING_VERSION: $(TESTFLIGHT_MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(IOS_BUILD_NUMBER)
        PRODUCT_BUNDLE_IDENTIFIER: de.letzgo.porridge.share
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
schemes:
  Porridge:
    build:
      targets:
        Porridge: all
    test:
      targets:
        - PorridgeTests
        - PorridgeUITests
    run:
      config: Debug
    archive:
      config: Release
  PorridgeMac:
    build:
      targets:
        PorridgeMac: all
    run:
      config: Debug
    archive:
      config: Release
